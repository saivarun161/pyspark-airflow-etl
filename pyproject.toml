[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyspark-airflow-etl"
version = "0.1.0"
description = "PySpark ETL for NYC taxi trips with declarative data-quality gates that fail the pipeline, orchestrated by Airflow"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Varun Kammadanam" }]
requires-python = ">=3.11"
keywords = ["pyspark", "airflow", "etl", "data-quality", "data-engineering"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["pyspark>=4.0,<5"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]
airflow = ["apache-airflow>=3.0,<4"]

[project.scripts]
tripetl = "tripetl.cli:main"

[project.urls]
Homepage = "https://github.com/saivarun161/pyspark-airflow-etl"
Issues = "https://github.com/saivarun161/pyspark-airflow-etl/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/tripetl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: exercises a real SparkSession (deselect with '-m \"not slow\"')",
]
filterwarnings = [
    # Spark 4 still calls a few deprecated CPython APIs during worker startup.
    "ignore::DeprecationWarning:pyspark.*",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# Ruff only honours .gitignore inside a git work tree; naming the virtualenvs
# here keeps `ruff check .` clean in a bare checkout too.
extend-exclude = [".venv", ".venv-airflow", "warehouse"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
# Airflow DAG files are declarative; top-level statements are the point.
"dags/*" = ["E402"]

[tool.coverage.run]
source = ["src/tripetl"]
branch = true
